services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: laptop_store_mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: always

  backend:
    build:
      context: .
      dockerfile: LaptopStore/Dockerfile
    container_name: laptop_store_backend
    environment:
      - ConnectionStrings__DefaultConnection=Server=mssql;Database=LaptopStoreDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true;
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5000:8080"
    depends_on:
      - mssql
    restart: always

volumes:
  mssql_data: